<script type="text/javascript">
    RED.nodes.registerType('updateTwin',{
        category: 'AZDT',
        color: '#a6bbcf',
        icon: "icons/function.svg",
        defaults: {
            name: { value: "" },
            azureDTConfig: { value: "", type: "azureDTConfig" },
        },
        inputs: 1,
        outputs: 2,
        outputLabels: ["Success", "Errors"],
        label: function() {
            return this.name || "updateTwin";
        }
    });
</script>

<script type="text/html" data-template-name="updateTwin">
    <div class="form-row">
        <label for="node-input-name"><i class="fa fa-tag"></i> Name</label>
        <input type="text" id="node-input-name" placeholder="Name">
    </div>
    <div class="form-row node-input-azureDTConfig">
        <label for="node-input-azureDTConfig"><i class="fa fa-sign-in"></i> Azure Auth</label>
        <input type="text" id="node-input-azureDTConfig" placeholder="Select...">
    </div>
</script>

<script type="text/html" data-help-name="updateTwin">
    <p>This node allows you to update digital twins using Azure Digital Twins. Configure the Tenant ID, Client ID, Client Secret, and the Digital Twins URL to set up the node.</p>
    <p><strong>Inputs:</strong></p>
    <p>The node expects <code>msg.payload</code> to be a single twin object or an array of twin objects. Each twin object must contain:</p>
    <ul>
        <li><code>twinId</code>: The ID of the twin to update.</li>
        <li><code>patch</code>: The JSON patch document for the update.</li>
    </ul>
    <p><strong>Outputs:</strong></p>
    <ol>
        <li><strong>Success:</strong> Contains an array of successfully updated twins with their results.</li>
        <li><strong>Errors:</strong> Contains an array of errors for twins that failed to update.</li>
    </ol>
</script>
