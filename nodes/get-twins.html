<script type="text/javascript">
    RED.nodes.registerType('getTwins',{
        category: 'AZDT',
        color: '#a6bbcf',
        icon: "icons/function.svg",
        defaults: {
            name: { value: "" },
            azureDTConfig: { value: "", type: "azureDTConfig" },
        },
        inputs: 1,
        outputs: 2,
        outputLabels: ["Success", "Errors"],
        label: function() {
            return this.name || "getTwins";
        }
    });
</script>

<script type="text/html" data-template-name="getTwins">
    <div class="form-row">
        <label for="node-input-name"><i class="fa fa-tag"></i> Name</label>
        <input type="text" id="node-input-name" placeholder="Name">
    </div>
    <div class="form-row node-input-azureDTConfig">
        <label for="node-input-azureDTConfig"><i class="fa fa-sign-in"></i> Azure Auth</label>
        <input type="text" id="node-input-azureDTConfig" placeholder="Select...">
    </div>
</script>

<script type="text/html" data-help-name="getTwins">
    <p>This node retrieves digital twins from Azure Digital Twins. Configure the Tenant ID, Client ID, Client Secret, and the Digital Twins URL to set up the node.</p>
    <p><strong>Inputs:</strong></p>
    <p>The node accepts an optional <code>msg.payload.modelName</code> to filter the twins by model. If <code>modelName</code> is not provided or set to <code>"all"</code>, all twins will be retrieved.</p>
    <p><strong>Outputs:</strong></p>
    <ol>
        <li><strong>Success:</strong> Contains an array of twins retrieved from the query.</li>
        <li><strong>Errors:</strong> Contains error details if the retrieval fails.</li>
    </ol>
</script>
