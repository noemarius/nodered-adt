<script type="text/javascript">
    RED.nodes.registerType('batchDeleteTwin',{
        category: 'AZDT',
        color: '#a6bbcf',

        defaults: {
            name: { value: "" },

<script type="text/html" data-help-name="batchDeleteTwin">
    <p>This node allows you to batch delete digital twins using Azure Digital Twins.
